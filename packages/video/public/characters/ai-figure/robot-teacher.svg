  <rect x="20" y="130" width="35" height="16" rx="8" fill="#5BB5B0"/>
  <rect x="145" y="130" width="35" height="16" rx="8" fill="#5BB5B0"/>
  <circle cx="18" cy="138" r="10" fill="#5BB5B0" opacity="0.7"/>
  <circle cx="182" cy="138" r="10" fill="#5BB5B0" opacity="0.7"/>
  <!-- pointer stick in right hand -->
  <line x1="182" y1="138" x2="195" y2="90" stroke="#E8C84A" stroke-width="3" stroke-linecap="round"/>
  <!-- legs -->
  <rect x="72" y="210" width="20" height="40" rx="8" fill="#5BB5B0" opacity="0.7"/>
  <rect x="108" y="210" width="20" height="40" rx="8" fill="#5BB5B0" opacity="0.7"/>
  <rect x="68" y="248" width="28" height="12" rx="6" fill="#5BB5B0"/>
  <rect x="104" y="248" width="28" height="12" rx="6" fill="#5BB5B0"/>
</svg>
